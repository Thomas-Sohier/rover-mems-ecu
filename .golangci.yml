run:
  go: "1.23"
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - misspell
    - unconvert

linters-settings:
  errcheck:
    # Serial read/write errors in tight loops are intentionally ignored.
    # Flag only clear mistakes outside of those patterns.
    check-type-assertions: true
    check-blank: false

issues:
  exclude-rules:
    # The 5-baud slow-init bit-bangs the line one bit at a time; a Break error
    # mid-frame cannot be recovered from and the handshake that follows reports
    # the failure. Every other Break/Read/Write call site checks its error.
    - path: internal/ecu/mems19/mems19\.go
      linters: [errcheck]
      text: "sp\\.Break"
